global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 10s
    timeout client  60s
    timeout server  60s

# HAProxy İstatistik ve Sağlık Paneli (http://localhost:8404/stats)
listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

# Tor SOCKS5 Round-Robin Load Balancer
frontend tor_socks_in
    bind *:9050
    mode tcp
    default_backend tor_socks_nodes

backend tor_socks_nodes
    mode tcp
    balance roundrobin
    server tor1 tor-node-1:9050 check inter 10s fall 3 rise 2
    server tor2 tor-node-2:9050 check inter 10s fall 3 rise 2
    server tor3 tor-node-3:9050 check inter 10s fall 3 rise 2
